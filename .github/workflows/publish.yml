name: Publish NuGet packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore PersonalBackofficeAppearance.slnx

      - name: Build
        run: dotnet build PersonalBackofficeAppearance.slnx --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack src/Our.Umbraco.PersonalAppearance.Core/Our.Umbraco.PersonalAppearance.Core.csproj --configuration Release --no-build --output artifacts
          dotnet pack src/Our.Umbraco.PersonalAppearance.v17/Our.Umbraco.PersonalAppearance.v17.csproj --configuration Release --no-build --output artifacts
          dotnet pack src/Our.Umbraco.PersonalAppearance.v18/Our.Umbraco.PersonalAppearance.v18.csproj --configuration Release --no-build --output artifacts

      - name: Push to NuGet.org
        run: >
          dotnet nuget push artifacts/*.nupkg
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
